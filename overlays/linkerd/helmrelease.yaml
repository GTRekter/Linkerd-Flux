---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkerd-crds
  namespace: linkerd
spec:
  chart:
    spec:
      version: "2.15.2"
      chart: linkerd-enterprise-crds
      sourceRef:
        kind: HelmRepository
        name: linkerd
  interval: 15m0s
  values:
    manageExternalWorkloads: true 
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkerd-control-plane
  namespace: linkerd
spec:
  chart:
    spec:
      chart: linkerd-enterprise-control-plane
      version: "2.15.2"
      sourceRef:
        kind: HelmRepository
        name: linkerd
  interval: 15m0s
  values:
    linkerd-control-plane:
      policyController:
        logLevel: debug
      destinationController:
        logLevel: debug
      proxy:
        logLevel: "debug,linkerd=debug,hickory=error,linkerd_balancer=trace"
