---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkerd-crds
  namespace: linkerd
spec:
  chart:
    spec:
      version: "2.17.7"
      chart: linkerd-enterprise-crds
      sourceRef:
        kind: HelmRepository
        name: linkerd
  interval: 15m0s
  values:
    manageExternalWorkloads: true 
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkerd-control-plane
  namespace: linkerd
spec:
  chart:
    spec:
      chart: linkerd-enterprise-control-plane
      version: "2.17.7"
      sourceRef:
        kind: HelmRepository
        name: linkerd
  interval: 15m0s
  values:
    policyController:
      logLevel: debug
    destinationController:
      logLevel: debug
    proxy:
      logLevel: "debug,linkerd=debug,hickory=error,linkerd_balancer=trace"
