---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkerd-enterprise-crds
  namespace: linkerd
spec:
  chart:
    spec:
      version: "2.19.0"
      chart: linkerd-enterprise-crds
      sourceRef:
        kind: HelmRepository
        name: linkerd-buoyant
  interval: 15m0s
  values:
    manageExternalWorkloads: true 
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkerd-enterprise-control-plane
  namespace: linkerd
spec:
  chart:
    spec:
      chart: linkerd-enterprise-control-plane
      version: "2.19.0"
      sourceRef:
        kind: HelmRepository
        name: linkerd-buoyant
  interval: 15m0s
  values:
    policyController:
      logLevel: debug
    destinationController:
      logLevel: debug
    proxy:
      logLevel: "debug,linkerd=debug,hickory=error,linkerd_balancer=trace"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkerd-buoyant
  namespace: linkerd-buoyant
spec:
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  chart:
    spec:
      chart: linkerd-buoyant
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: linkerd-buoyant
      version: "2.19.0"
  interval: 15m0s
  values:
    licenseSecret: buoyant-license 